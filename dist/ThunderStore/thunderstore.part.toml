[package]
websiteUrl = "https://github.com/blbrdv/Aegir"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./dist/ThunderStore/icon.png"
readme = "./dist/ThunderStore/README.md"
outdir = "./output/ThunderStore"

[[build.copy]]
source = "./dist/ThunderStore/FAQ.md"
target = "./FAQ.md"

[[build.copy]]
source = "./dist/ThunderStore/CHANGELOG.md"
target = "./CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish]
categories = [ "mods", "misc", "client-side" ]
