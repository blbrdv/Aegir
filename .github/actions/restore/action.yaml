name: 'Restore build'

inputs:
  only-restore:
    type: boolean
    required: false
    default: true
  no-mod-cache:
    type: boolean
    required: false
    default: true

runs:
  using: 'composite'

  steps:
    - id: params
      shell: bash
      run: |
        set -x
        
        if [[ "true" == "${{ inputs.no-mod-cache }}" ]]
        then
          deps="${{ github.workspace }}/build/packages.lock.json"
          restore_cmd="dotnet restore ${{ github.workspace }}/build/_build.csproj"
        else
          IFS='' read -r -d '' deps <<"EOF"
          ${{ github.workspace }}/build/packages.lock.json
          ${{ github.workspace }}/src/packages.lock.json
          EOF
          
          restore_cmd="dotnet restore"
        fi
          
        echo "deps<<EOF" >> $GITHUB_OUTPUT
        echo "$deps" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "restore-cmd=$restore_cmd" >> "$GITHUB_OUTPUT"
  
    - uses: actions/cache@v6.1.0
      if: ${{ !inputs.only-restore }}
      name: Cache build
      with:
        path: |
          ${{ github.workspace }}/build/bin/**
          ${{ github.workspace }}/build/obj/**
        key: >
          build-${{
            hashFiles(
              './.fallout/**',
              './build/**',
              '!./build/bin/**',
              '!./build/obj/**'
            )
          }}
        restore-keys: build-
        enableCrossOsArchive: true

    - uses: actions/cache@v6.1.0
      name: Cache project
      if: ${{ !inputs.only-restore && !inputs.no-mod-cache }}
      with:
        path: |
          ${{ github.workspace }}/src/bin/**
          ${{ github.workspace }}/src/obj/**
        key: >
          src-${{
            hashFiles(
              './src/**',
              '!./src/bin/**',
              '!./src/obj/**'
            )
          }}
        restore-keys: src-
        enableCrossOsArchive: true

    - uses: actions/cache/restore@v6.1.0
      if: ${{ inputs.only-restore }}
      name: Cache build
      with:
        path: |
          ${{ github.workspace }}/build/bin/**
          ${{ github.workspace }}/build/obj/**
        key: >
          build-${{
            hashFiles(
              './.fallout/**',
              './build/**',
              '!./build/bin/**',
              '!./build/obj/**'
            )
          }}
        restore-keys: build-
        enableCrossOsArchive: true

    - uses: actions/cache/restore@v6.1.0
      name: Cache project
      if: ${{ inputs.only-restore && !inputs.no-mod-cache }}
      with:
        path: |
          ${{ github.workspace }}/src/bin/**
          ${{ github.workspace }}/src/obj/**
        key: >
          src-${{
            hashFiles(
              './src/**',
              '!./src/bin/**',
              '!./src/obj/**'
            )
          }}
        restore-keys: src-
        enableCrossOsArchive: true

    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: ${{ steps.params.outputs.deps }}

    - name: Restore project(s)
      shell: bash
      run: |
        ${{ steps.params.outputs.restore-cmd }}
        dotnet tool restore

