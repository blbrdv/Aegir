name: Release

on:
  workflow_dispatch:
    inputs: 
      github:
        type: boolean
        default: false
        description: Release project to GitHub Releases
      thunderstore:
        type: boolean
        default: false
        description: Release project to ThunderStore
      nexusmods:
        type: boolean
        default: false
        description: Release project to NexusMods
  push:
    branches:
      - 'main'
    paths:
      - 'dist/**'
      - 'src/**'
      - 'Aegir.sln'
      - 'global.json'

env:
  ContinuousIntegrationBuild: true

jobs:
  meta:
    name: 'Get project info and check version'
    
    runs-on: ubuntu-latest
    
    outputs:
      name: ${{ steps.props.outputs.name }}
      author: ${{ steps.props.outputs.author }}
      description: ${{ steps.props.outputs.description }}
      version: ${{ steps.props.outputs.version }}
      game-name: ${{ steps.props.outputs.game-name }}
      tag: ${{ steps.check.outputs.tag }}
    
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Get project properties
        id: props
        run: |
          set -x
          
          mapfile -t info < <(dotnet msbuild ${{ github.workspace }}/src \
            -getProperty:Product,Authors,Description,Version,GameTitle \
            | jq .Properties[])
          
          echo "name=${info[0]}" >> "$GITHUB_OUTPUT"
          echo "author=${info[1]}" >> "$GITHUB_OUTPUT"
          echo "description=${info[2]}" >> "$GITHUB_OUTPUT"
          echo "version=${info[3]}" >> "$GITHUB_OUTPUT"
          echo "${info[4]}" | awk '{printf "%s=%s\n", "game-name", tolower($0)}' >> "$GITHUB_OUTPUT"

      - name: Checking tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          
          tag="v${{ steps.props.outputs.version }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          
          mapfile -t tags < <(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ steps.props.outputs.author }}/${{ steps.props.outputs.name }}/tags \
            | jq .[].name)
          
          for name in "${tags[@]}"
          do
            if [[ "$name" == "$tag" ]]; then
              echo "Tag '$tag' already exists. Update project version."
              exit 1
            fi
          done

  build:
    name: 'Build'
    
    needs: meta

    uses: ./.github/workflows/build-project.yaml
    with:
      target-ref: 'main'
      build-conf: 'Release'
      upload: true

  github-release:
    if: ${{ inputs.github && !github.event.act }}

    name: 'Github release'

    runs-on: ubuntu-latest

    needs: [ build, meta ]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download project artefact
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.sha }}

      - name: Parse changelog
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.4.0
        with:
          validation_level: warn
          version: ${{ needs.meta.outputs.version }}
          path: ${{ github.workspace }}/CHANGELOG.md

      - name: GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.meta.outputs.tag }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: false
          artifacts: ${{ github.workspace }}/${{ needs.meta.outputs.name }}.dll
  
  thunderstore-release:
    if: ${{ inputs.thunderstore && !github.event.act }}

    name: 'Thunderstore release'

    runs-on: ubuntu-latest

    needs: [ build, meta ]
    
    steps:
      - uses: actions/checkout@v7

      - name: Download project artefact
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.sha }}

      - name: Publish to Thunderstore
        uses: MaxtorCoder/thunderstore-publish@v1.0.2
        with:
          token: ${{ secrets.TS_TOKEN }}
          communities: ${{ needs.meta.outputs.game-name }}
          namespace: ${{ needs.meta.outputs.author }}
          name: ${{ needs.meta.outputs.name }}
          description: ${{ needs.meta.outputs.description }}
          version: ${{ needs.meta.outputs.version }}
          file: ${{ github.workspace }}/output/ThunderStore/${{ needs.meta.outputs.author }}-${{ needs.meta.outputs.name }}-${{ needs.meta.outputs.version }}.zip
  
  nexusmods-release:
    if: ${{ inputs.nexusmods && !github.event.act }}

    name: 'NexusMods release'

    runs-on: ubuntu-latest

    needs: [ build, meta ]
    
    steps:
      - uses: actions/checkout@v7

      - name: Download project artefact
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.sha }}
      
      - name: Get changelog for current version
        id: current-changelog
        run: |
          set -x
          
          echo "value=$(cat ${{ github.workspace }}/dist/NexusMods/CHANGELOG.${{ needs.meta.outputs.version }}.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish to NexusMods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ secrets.NEXUS_FILE_ID }}
          mod_id: ${{ secrets.NEXUS_MOD_ID }}
          filename: ${{ github.workspace }}/output/NexusMods/${{ needs.meta.outputs.name }}-${{ needs.meta.outputs.version }}.zip
          display_name: ${{ needs.meta.outputs.name }}
          primary_mod_manager_download: true
          show_requirements_pop_up: true
          changelog: ${{ steps.current-changelog.outputs.value }}
    
