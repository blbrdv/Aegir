name: Release

on:
  workflow_dispatch:
    inputs: 
      github:
        type: boolean
        default: false
        description: Release project to GitHub Releases
      thunderstore:
        type: boolean
        default: false
        description: Release project to ThunderStore
      nexusmods:
        type: boolean
        default: false
        description: Release project to NexusMods
  push:
    branches:
      - 'main'
    paths:
      - 'dist/**'
      - 'src/**'
      - 'Aegir.sln'
      - 'global.json'

env:
  ContinuousIntegrationBuild: true

jobs:
  build:
    name: 'Build project'
    
    runs-on: ubuntu-latest
    
    outputs:
      name: ${{ steps.props.outputs.name }}
      author: ${{ steps.props.outputs.author }}
      version: ${{ steps.props.outputs.version }}
      tfm: ${{ steps.props.outputs.tfm }}

    steps:
      - uses: actions/checkout@v7

      - name: Dotnet restore
        uses: ./.github/actions/restore
        with:
          only-restore: false
          no-mod-cache: false

      - name: Get project properties
        id: props
        run: |
          set -x
    
          mapfile -t info < <(dotnet msbuild ${{ github.workspace }}/src \
            -getProperty:Product,Authors,Version,TargetFramework \
            | jq -r .Properties[])
      
          echo "name=${info[0]}" >> "$GITHUB_OUTPUT"
          echo "author=${info[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${info[2]}" >> "$GITHUB_OUTPUT"
          echo "tfm=${info[3]}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: ./.github/actions/build
        with:
          build-conf: 'Release'

  github-release:
    if: ${{ case( github.event_name == 'workflow_dispatch', inputs.github, true ) }}

    name: 'Github release'

    runs-on: ubuntu-latest

    needs: build

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Checking tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x

          tag="v${{ needs.build.outputs.version }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          mapfile -t tags < <(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ needs.build.outputs.author }}/${{ needs.build.outputs.name }}/tags \
            | jq -r .[].name)

          for name in "${tags[@]}"
          do
            if [[ "$name" == "$tag" ]]; then
              echo "Tag '$tag' already exists. Update project version."
              exit 1
            fi
          done

      - name: Download project artefact
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.sha }}
          path: ${{ github.workspace }}/src/bin/Release/${{ needs.build.outputs.tfm }}

      - name: Parse changelog
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.4.0
        with:
          validation_level: warn
          version: ${{ needs.build.outputs.version }}
          path: ${{ github.workspace }}/CHANGELOG.md

      - name: GitHub release
        if: ${{ !github.event.act }}
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.check.outputs.tag }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: false
          artifacts: ${{ github.workspace }}/src/bin/Release/${{ needs.build.outputs.tfm }}/${{ needs.build.outputs.name }}.dll
  
  thunderstore-release:
    if: ${{ case( github.event_name == 'workflow_dispatch', inputs.thunderstore, true ) }}

    name: 'Thunderstore release'

    runs-on: ubuntu-latest

    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Dotnet restore
        uses: ./.github/actions/restore

      - name: Download project artefact
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.sha }}
          path: ${{ github.workspace }}/src/bin/Release/${{ needs.build.outputs.tfm }}

      - name: Pack
        run: ./run.sh PackForThunderstore --build-config Release

      - name: Publish
        if: ${{ !github.event.act }}
        run: >
          dotnet tcli publish
          --file ./output/ThunderStore/${{ needs.build.outputs.author }}-${{ needs.build.outputs.name }}-${{ needs.build.outputs.version }}.zip
          --token ${{ secrets.TS_TOKEN }}
  
  nexusmods-release:
    if: ${{ case( github.event_name == 'workflow_dispatch', inputs.nexusmods, true ) }}
    
    name: 'NexusMods release'

    runs-on: ubuntu-latest

    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Dotnet restore
        uses: ./.github/actions/restore

      - name: Download project artefact
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.sha }}
          path: ${{ github.workspace }}/src/bin/Release/${{ needs.build.outputs.tfm }}
        
      - name: Pack
        run: ./run.sh PackForNexusMods --build-config Release

      - name: Get changelog for current version
        id: current-changelog
        run: |
          set -ex
          echo "value=$(cat ${{ github.workspace }}/dist/NexusMods/CHANGELOG.${{ needs.build.outputs.version }}.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: ${{ !github.event.act }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ secrets.NEXUS_FILE_ID }}
          mod_id: ${{ secrets.NEXUS_MOD_ID }}
          filename: ${{ github.workspace }}/output/NexusMods/${{ needs.build.outputs.name }}-${{ needs.build.outputs.version }}.zip
          display_name: ${{ needs.build.outputs.name }}
          version: ${{ needs.build.outputs.version }}
          primary_mod_manager_download: true
          show_requirements_pop_up: true
          changelog: ${{ steps.current-changelog.outputs.value }}
