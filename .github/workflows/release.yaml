name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'dist/**'
      - 'src/**'
      - 'Aegir.sln'
      - 'global.json'

env:
  ContinuousIntegrationBuild: true
  Game: valheim
  Name: Aegir

jobs:
  check-tag:
    name: 'Check release tag existence'
    
    runs-on: ubuntu-latest
    
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Checking tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(dotnet msbuild "${{ github.workspace }}/src/Aegir.csproj" -getProperty:Version)
          tag="v$version"
          echo "Current version: $version";
          echo "Current tag: $tag";
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          
          $tags=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/blbrdv/${{ env.Name }}/tags \
            | jq .[].name)
          
          for name in $tags
          do
            if [ "$name" == "$tag" ]; then
              echo "Tag '$tag' already exists. Update project version."
              exit 1
            fi
          done

  build:
    needs: check-tag

    name: Build project

    uses: ./.github/workflows/build-project.yaml
    with:
      target-ref: 'main'
      build-conf: 'Release'

  github-release:
    needs: [ build, check-tag ]

    name: Github release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download project artefact
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ github.sha }}

      - name: Parse changelog
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.4
        with:
          validation_level: warn
          version: ${{ needs.check-tag.outputs.version }}
          path: ${{ github.workspace }}/CHANGELOG.md

      - name: GitHub release
        uses: ncipollo/release-action@v1.21
        with:
          tag: ${{ needs.check-tag.outputs.tag }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: false
          artifacts: ${{ github.workspace }}/${{ env.Name }}.dll
