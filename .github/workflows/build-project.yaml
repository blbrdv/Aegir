name: 'Build project'

on:
  workflow_call:
    inputs:
      target-ref:
        required: true
        type: string
      build-conf:
        required: false
        type: string
        default: Debug
      upload:
        required: false
        type: boolean
        default: false
    outputs:
      tfm:
        value: ${{ jobs.build-project.outputs.tfm }}
      name:
        value: ${{ jobs.build-project.outputs.name }}
      author:
        value: ${{ jobs.build-project.outputs.author }}
      description:
        value: ${{ jobs.build-project.outputs.description }}
      version:
        value: ${{ jobs.build-project.outputs.version }}

env:
  GAME_ID: 896660
  GAME_NAME: Valheim dedicated server
  ContinuousIntegrationBuild: true

jobs:
  build-project:
    runs-on: ubuntu-latest
    
    outputs:
      tfm: ${{ steps.meta.outputs.tfm }}
      name: ${{ steps.meta.outputs.name }}
      author: ${{ steps.meta.outputs.author }}
      description: ${{ steps.meta.outputs.description }}
      version: ${{ steps.meta.outputs.version }}
    
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 'blbrdv/Aegir'
          ref: ${{ inputs.target-ref }}
          fetch-depth: 0

      - name: Dotnet restore
        uses: ./.github/actions/restore
      
      - name: Install SteamCMD
        id: steamcmd
        uses: CyberAndrii/setup-steamcmd@v1.3.0
  
      - name: Set game path
        id: game-path
        run: |
          value="${{ steps.steamcmd.outputs.directory }}/steamapps/common/${{ env.GAME_NAME }}"
          echo "Game path is $value"
          echo "value=$value" >> "$GITHUB_OUTPUT"
  
      # Little hack to let Steam think that we own this game
      - name: Create Steam manifest file
        run: |
          mkdir -p "${{ steps.game-path.outputs.value }}"
          manifest=$(cat <<-END
            "AppState"
            {
              "appid" "${{ env.GAME_ID }}"
              "Universe" "1"
              "installdir" "${{ env.GAME_NAME }}"
              "StateFlags" "6"
            }
          END
          )
          echo "$manifest" > ${{ steps.steamcmd.outputs.directory }}/steamapps/appmanifest_${{ env.GAME_ID }}.acf
          cat "${{ steps.steamcmd.outputs.directory }}/steamapps/appmanifest_${{ env.GAME_ID }}.acf"
  
      - name: Download game
        id: download
        run: |
          s=0
          n=1
          until [ "$n" -ge 4 ]; do
            echo "Attempt #$n"
            steamcmd +force_install_dir "${{ steps.game-path.outputs.value }}" +login anonymous +app_update ${{ env.GAME_ID }} validate +quit && break || s=$?
            if [ "$s" -eq 8 ]; then
              n=$((n+1))
            else
              exit $s
            fi
            if [ "$n" -lt 3 ]; then
              sleep 5
            fi 
          done
  
      - name: Restore project
        run: ./run.sh restore
      
      - name: Get project meta info
        id: meta
        run: |
          mapfile -t values < <(dotnet msbuild "${{ github.workspace }}/src/Aegir.csproj" \
            -getProperty:TargetFramework,Product,Authors,Description,Version \
            | jq .Properties[])
          
          echo "Values: ${values[@]}"
          echo "tfm=${values[0]}" >> "$GITHUB_OUTPUT"
          echo "name=${values[1]}" >> "$GITHUB_OUTPUT"
          echo "author=${values[2]}" >> "$GITHUB_OUTPUT"
          echo "description=${values[3]}" >> "$GITHUB_OUTPUT"
          echo "version=${values[4]}" >> "$GITHUB_OUTPUT"
  
      - name: Build project
        run: ./run.sh compile --build-config ${{ inputs.build-conf }} --game-path "${{ steps.game-path.outputs.value }}"
  
      - name: Upload build
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ github.sha }}
          path: ${{ github.workspace }}/src/bin/${{ inputs.build-conf }}/${{ steps.meta.outputs.tfm }}/Aegir.dll
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
