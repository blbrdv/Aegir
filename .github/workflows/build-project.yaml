name: 'Build project'

on:
  workflow_call:
    inputs:
      target-ref:
        required: true
        type: string
      build-conf:
        required: false
        type: string
        default: Debug
      upload:
        required: false
        type: boolean
        default: false

env:
  ContinuousIntegrationBuild: true

jobs:
  build-project:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 'blbrdv/Aegir'
          ref: ${{ inputs.target-ref }}
          fetch-depth: 0

      - name: Dotnet restore
        uses: ./.github/actions/restore

      - name: Install SteamCMD
        id: steamcmd
        uses: CyberAndrii/setup-steamcmd@v1.3.0

      - name: Restore project
        run: ./run.sh restore

      - name: Get project properties
        id: props
        run: |
          set -x
          
          mapfile -t info < <(dotnet msbuild ${{ github.workspace }}/src \
            -getProperty:TargetFramework,Product,GameTitle,GameId \
            | jq -r .Properties[])
          
          echo "tfm=${info[0]}" >> "$GITHUB_OUTPUT"
          echo "name=${info[1]}" >> "$GITHUB_OUTPUT"
          game_name="${info[2]}"
          echo "game-name=$game_name" >> "$GITHUB_OUTPUT"
          echo "game-id=${info[3]}" >> "$GITHUB_OUTPUT"
          echo "game-path=${{ steps.steamcmd.outputs.directory }}/steamapps/common/$game_name" >> "$GITHUB_OUTPUT"
  
      # Little hack to let Steam think that we own this game
      - name: Create Steam manifest file
        run: |
          set -x
          
          mkdir -p "${{ steps.props.outputs.game-path }}"
          manifest=$(cat <<-END
            "AppState"
            {
              "appid" "${{ steps.props.outputs.game-id }}"
              "Universe" "1"
              "installdir" "${{ steps.props.outputs.game-name }}"
              "StateFlags" "6"
            }
          END
          )
          echo "$manifest" > ${{ steps.steamcmd.outputs.directory }}/steamapps/appmanifest_${{ steps.props.outputs.game-id }}.acf
  
      - name: Download game
        id: download
        run: |
          set -x
          
          s=0
          n=1
          until [ "$n" -ge 4 ]; do
            steamcmd \
              +force_install_dir "${{ steps.props.outputs.game-path }}" \
              +login anonymous \
              +app_update ${{ steps.props.outputs.game-id }} validate \
              +quit \
              && break \
              || s=$?
            if [ "$s" -eq 8 ]; then
              n=$((n+1))
            else
              exit $s
            fi
            if [ "$n" -lt 3 ]; then
              sleep 5
            fi 
          done
  
      - name: Build project
        run: ./run.sh compile --build-config ${{ inputs.build-conf }} --game-path "${{ steps.props.outputs.game-path }}"
  
      - name: Upload build
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ github.sha }}
          path: ${{ github.workspace }}/src/bin/${{ inputs.build-conf }}/${{ steps.props.outputs.tfm }}/${{ steps.props.outputs.name }}.dll
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
