name: Build

on:
  workflow_dispatch:
    inputs:
      target-ref:
        description: The branch, tag or SHA to checkout.
        type: string

  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/build.yaml'
      - '.github/actions/**'
      - '.fallout/**'
      - 'build/**'
      - 'dist/**'
      - 'src/**'
      - 'Aegir.sln'
      - 'run.*'
      - 'global.json'

env:
  ContinuousIntegrationBuild: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set target ref
        id: ref
        run: |
          set -x
          
          if [[ "true" == "${{ inputs.target-ref == '' }}" ]]
          then
            ref="${{ github.ref }}"
          else
            ref="${{ inputs.target-ref }}"
          fi
          
          echo "target-ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: 'blbrdv/Aegir'
          ref: ${{ steps.ref.outputs.target-ref }}
          fetch-depth: 0

      - name: Dotnet restore
        uses: ./.github/actions/restore
        with:
          only-restore: false
          no-mod-cache: false
          
      - name: Build
        uses: ./.github/actions/build
        with:
          upload: true
